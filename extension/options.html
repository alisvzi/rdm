<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>تنظیمات افزونه‌ی RDM</title>
  <link rel="stylesheet" href="popup.css">
  <style>body { width: auto; max-width: 560px; margin: 30px auto; padding: 0 16px; }</style>
</head>
<body>
  <h2>تنظیمات افزونه‌ی RDM</h2>

  <div class="field">
    <label for="token">کد اتصال</label>
    <input id="token" type="password" spellcheck="false" autocomplete="off">
    <p class="hint">در برنامه‌ی RDM: تنظیمات ← «اتصال به مرورگر» ← دکمه‌ی «کپی»، و اینجا جای‌گذاری کنید.</p>
  </div>

  <div class="field">
    <label for="port">پورت</label>
    <input id="port" type="number" min="1" max="65535">
  </div>

  <div class="field">
    <label for="min">فقط فایل‌های بزرگ‌تر از این مقدار (مگابایت) به RDM بروند؛ ۰ = همه</label>
    <input id="min" type="number" min="0">
  </div>

  <label class="row"><input type="checkbox" id="enabled"> <span>گرفتن خودکار دانلودهای مرورگر</span></label>

  <p>
    <button id="save">ذخیره</button>
    <button id="test" type="button">آزمایش اتصال</button>
  </p>
  <p id="msg" class="msg"></p>

  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
