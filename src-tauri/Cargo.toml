[package]
name = "rdm-gui"
version = "0.3.0"
edition = "2021"
description = "RDM download manager (desktop app)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
rdm-core = { path = "../crates/core" }
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tiny_http = "0.12"
chrono = "0.4"
