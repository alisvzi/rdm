[package]
name = "rdm-core"
version = "0.3.0"
edition = "2021"
description = "Download engine and download manager logic (no UI)"

[dependencies]
tokio = { version = "1", features = ["rt", "fs", "io-util", "time"] }
# Default features = native TLS (SChannel on Windows) + system proxy support.
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
percent-encoding = "2"
getrandom = "0.2"
